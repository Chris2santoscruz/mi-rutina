<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Rutina v3.2</title>
<style>
:root {
--bg-main: #0b1120;
--bg-card: #151e32;
--bg-card-hover: #1b2640;
--primary: #2563eb;
--primary-hover: #1d4ed8;
--success: #10b981;
--danger: #ef4444;
--text-main: #f8fafc;
--text-muted: #94a3b8;
--border: #24324f;
--badge-pecho: #2563eb;
--badge-hombro: #8b5cf6;
--badge-biceps: #059669;
--badge-pierna: #ea580c;
--badge-espalda: #0284c7;
--badge-triceps: #d97706;
--badge-core: #64748b;
}
*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
-webkit-tap-highlight-color: transparent;
}
body {
background-color: var(--bg-main);
color: var(--text-main);
padding-bottom: 70px;
}
header {
background: rgba(11, 17, 32, 0.95);
backdrop-filter: blur(10px);
padding: 16px 20px;
border-bottom: 1px solid var(--border);
position: sticky;
top: 0;
z-index: 100;
}
.header-content {
max-width: 600px;
margin: 0 auto;
display: flex;
justify-content: space-between;
align-items: center;
}
header h1 {
font-size: 1.15rem;
letter-spacing: 0.5px;
font-weight: 700;
}
.user-info-container {
display: flex;
align-items: center;
gap: 8px;
}
.user-badge {
background: #1e293b;
color: #38bdf8;
border: 1px solid var(--border);
padding: 6px 12px;
border-radius: 20px;
font-size: 0.82rem;
font-weight: 700;
cursor: pointer;
}
.btn-logout {
background: rgba(239, 68, 68, 0.15);
color: #ef4444;
border: 1px solid rgba(239, 68, 68, 0.3);
padding: 6px 10px;
border-radius: 12px;
font-size: 0.78rem;
font-weight: 700;
cursor: pointer;
}
.container {
max-width: 600px;
margin: 0 auto;
padding: 0 16px;
}
.nav-tabs {
display: flex;
gap: 8px;
margin: 16px 0 20px;
background: #11192d;
padding: 5px;
border-radius: 12px;
border: 1px solid var(--border);
}
.tab-btn {
flex: 1;
padding: 12px 6px;
font-size: 0.9rem;
font-weight: 700;
border: none;
background: transparent;
color: var(--text-muted);
border-radius: 8px;
cursor: pointer;
transition: all 0.2s ease;
}
.tab-btn.active {
background: var(--primary);
color: #ffffff;
box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}
.tab-content {
display: none;
}
.tab-content.active {
display: block;
}
.day-header {
margin-bottom: 14px;
}
.day-header h2 {
font-size: 1.05rem;
color: #38bdf8;
font-weight: 600;
}
.btn-add-open {
width: 100%;
padding: 13px;
margin-top: 6px;
margin-bottom: 18px;
background: rgba(37, 99, 235, 0.12);
color: #60a5fa;
border: 1px dashed #2563eb;
border-radius: 12px;
font-size: 0.92rem;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
}
.exercise-card {
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 14px;
padding: 14px;
margin-bottom: 12px;
display: flex;
flex-direction: column;
gap: 12px;
position: relative;
}
.btn-remove-ex {
position: absolute;
top: 10px;
right: 10px;
background: rgba(239, 68, 68, 0.12);
color: #f87171;
border: 1px solid rgba(239, 68, 68, 0.25);
width: 26px;
height: 26px;
border-radius: 7px;
font-size: 0.8rem;
font-weight: 700;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}
.card-top {
display: flex;
gap: 14px;
align-items: center;
padding-right: 28px;
}
.thumb {
width: 72px;
height: 72px;
border-radius: 10px;
object-fit: cover;
background: #0b1120;
border: 1px solid var(--border);
flex-shrink: 0;
}
.info {
flex: 1;
min-width: 0;
}
.tag {
display: inline-block;
font-size: 0.68rem;
text-transform: uppercase;
font-weight: 800;
padding: 3px 7px;
border-radius: 5px;
margin-bottom: 5px;
color: #ffffff;
}
.tag-pecho { background: var(--badge-pecho); }
.tag-hombro { background: var(--badge-hombro); }
.tag-bíceps, .tag-biceps { background: var(--badge-biceps); }
.tag-pierna, .tag-cuádriceps, .tag-isquios, .tag-aductores, .tag-abductores, .tag-glúteo, .tag-gemelos { background: var(--badge-pierna); }
.tag-espalda, .tag-deltoides-post { background: var(--badge-espalda); }
.tag-tríceps, .tag-triceps { background: var(--badge-triceps); }
.tag-core, .tag-trapecio, .tag-abdomen { background: var(--badge-core); }
.info h3 {
font-size: 0.98rem;
font-weight: 700;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-bottom: 4px;
}
.scheme {
font-size: 0.82rem;
color: var(--text-muted);
}
.card-bottom {
display: flex;
justify-content: space-between;
align-items: center;
padding-top: 10px;
border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.weight-control {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.85rem;
color: #cbd5e1;
}
.weight-input {
width: 70px;
padding: 6px 10px;
background: #090e1a;
border: 1px solid var(--border);
border-radius: 8px;
color: #34d399;
font-size: 0.95rem;
font-weight: 700;
text-align: center;
outline: none;
}
.video-btn {
font-size: 0.82rem;
font-weight: 600;
color: #38bdf8;
text-decoration: none;
display: inline-flex;
align-items: center;
gap: 5px;
padding: 6px 10px;
border-radius: 6px;
background: rgba(56, 189, 248, 0.08);
}
.finish-wrapper {
margin-top: 10px;
text-align: center;
}
.btn-complete {
width: 100%;
padding: 16px;
background: var(--success);
color: #ffffff;
border: none;
border-radius: 12px;
font-size: 1rem;
font-weight: 700;
cursor: pointer;
box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
}
.status-log {
margin-top: 10px;
font-size: 0.85rem;
font-weight: 500;
min-height: 20px;
}
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0, 0, 0, 0.85);
backdrop-filter: blur(5px);
display: flex;
align-items: center;
justify-content: center;
z-index: 999;
padding: 16px;
}
.modal-box {
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 16px;
padding: 20px;
max-width: 420px;
width: 100%;
text-align: center;
max-height: 90vh;
display: flex;
flex-direction: column;
}
.modal-box h2 {
margin-bottom: 6px;
color: #fff;
font-size: 1.15rem;
}
.modal-box p {
font-size: 0.84rem;
color: var(--text-muted);
margin-bottom: 14px;
}
.input-group {
text-align: left;
margin-bottom: 12px;
}
.input-group label {
display: block;
font-size: 0.78rem;
color: var(--text-muted);
margin-bottom: 4px;
font-weight: 600;
}
.modal-box input, .modal-box select {
width: 100%;
padding: 10px 12px;
border-radius: 8px;
border: 1px solid var(--border);
background: #090e1a;
color: #fff;
font-size: 0.95rem;
outline: none;
}
.modal-box button {
width: 100%;
padding: 12px;
margin-top: 6px;
background: var(--primary);
color: #fff;
border: none;
border-radius: 8px;
font-size: 0.95rem;
font-weight: 700;
cursor: pointer;
}
.modal-box button:disabled {
opacity: 0.6;
cursor: not-allowed;
}
.btn-secondary {
background: transparent !important;
color: var(--text-muted) !important;
border: 1px solid var(--border) !important;
margin-top: 8px !important;
}
.login-msg {
margin-top: 12px;
font-size: 0.84rem;
font-weight: 600;
min-height: 20px;
line-height: 1.35;
}
.modal-tabs {
display: flex;
gap: 6px;
margin-bottom: 12px;
background: #090e1a;
padding: 4px;
border-radius: 10px;
}
.modal-tab-btn {
flex: 1;
padding: 8px !important;
margin-top: 0 !important;
font-size: 0.82rem !important;
background: transparent !important;
color: var(--text-muted) !important;
}
.modal-tab-btn.active {
background: var(--primary) !important;
color: #fff !important;
}
.banco-filters {
display: flex;
gap: 8px;
margin-bottom: 10px;
}
.banco-list {
overflow-y: auto;
max-height: 280px;
display: flex;
flex-direction: column;
gap: 8px;
margin-bottom: 10px;
text-align: left;
padding-right: 4px;
}
.banco-item {
background: #0b1120;
border: 1px solid var(--border);
border-radius: 10px;
padding: 10px;
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
}
.banco-item-info h4 {
font-size: 0.9rem;
color: #fff;
margin-top: 2px;
}
.btn-pick {
width: auto !important;
padding: 7px 12px !important;
margin-top: 0 !important;
font-size: 0.8rem !important;
background: var(--success) !important;
flex-shrink: 0;
}
.empty-day-msg {
text-align: center;
padding: 24px 12px;
color: var(--text-muted);
font-size: 0.9rem;
background: rgba(21, 30, 50, 0.5);
border-radius: 12px;
border: 1px dashed var(--border);
margin-bottom: 12px;
}
</style>
</head>
<body>

<header>
<div class="header-content">
<h1>MI ENTRENAMIENTO</h1>
<div class="user-info-container">
<div class="user-badge" onclick="abrirModalSiNoHayUsuario()">
👤 <span id="nombre-usuario-display">Ingresar</span>
</div>
<button id="btn-logout" class="btn-logout" onclick="cerrarSesion()" style="display: none;">Salir</button>
</div>
</div>
</header>

<div id="modal-usuario" class="modal-overlay" style="display: none;">
<div class="modal-box">
<h2>Acceso a tu Perfil</h2>
<p>Ingresa tu usuario y contraseña:</p>
<div class="input-group">
<label>Usuario:</label>
<input type="text" id="input-user" placeholder="Ej: christian" autocomplete="off">
</div>
<div class="input-group">
<label>Contraseña:</label>
<input type="password" id="input-pass" placeholder="••••••••" autocomplete="off" onkeydown="if(event.key==='Enter') procesarAcceso('login')">
</div>
<button id="btn-login" onclick="procesarAcceso('login')">Iniciar Sesión</button>
<button id="btn-reg" class="btn-secondary" onclick="procesarAcceso('registro')">Registrarme como Nuevo</button>
<div id="login-status" class="login-msg"></div>
</div>
</div>

<div id="modal-banco" class="modal-overlay" style="display: none;">
<div class="modal-box">
<h2 id="titulo-modal-banco">Agregar Ejercicio</h2>
<div class="modal-tabs">
<button id="tab-catalogo" class="modal-tab-btn active" onclick="cambiarModoBanco('catalogo')">Elegir del Banco</button>
<button id="tab-manual" class="modal-tab-btn" onclick="cambiarModoBanco('manual')">Crear Manual</button>
</div>

<div id="vista-catalogo">
<div class="banco-filters">
<input type="text" id="buscar-ex" placeholder="Buscar ejercicio..." oninput="filtrarBanco()">
<select id="filtro-musculo" onchange="filtrarBanco()">
<option value="">Todos</option>
<option value="Pecho">Pecho</option>
<option value="Espalda">Espalda</option>
<option value="Hombro">Hombro</option>
<option value="Pierna">Pierna / Cuádriceps / Isquios</option>
<option value="Bíceps">Bíceps</option>
<option value="Tríceps">Tríceps</option>
<option value="Glúteo">Glúteo</option>
<option value="Gemelos">Gemelos</option>
<option value="Abdomen">Abdomen / Core</option>
<option value="Trapecio">Trapecio</option>
</select>
</div>
<div class="input-group">
<label>Series y repeticiones para tu rutina:</label>
<input type="text" id="series-catalogo" value="3 series x 10-12 reps">
</div>
<div id="lista-banco" class="banco-list"></div>
</div>

<div id="vista-manual" style="display: none;">
<div class="input-group">
<label>Nombre del Ejercicio:</label>
<input type="text" id="manual-nombre" placeholder="Ej: Press Declinado con Barra">
</div>
<div class="input-group">
<label>Grupo Muscular:</label>
<select id="manual-musculo">
<option value="Pecho">Pecho</option>
<option value="Espalda">Espalda</option>
<option value="Hombro">Hombro</option>
<option value="Deltoides Post">Deltoides Post</option>
<option value="Pierna">Pierna</option>
<option value="Cuádriceps">Cuádriceps</option>
<option value="Isquios">Isquios</option>
<option value="Glúteo">Glúteo</option>
<option value="Aductores">Aductores</option>
<option value="Abductores">Abductores</option>
<option value="Gemelos">Gemelos</option>
<option value="Bíceps">Bíceps</option>
<option value="Tríceps">Tríceps</option>
<option value="Trapecio">Trapecio</option>
<option value="Abdomen">Abdomen</option>
<option value="Core">Core</option>
</select>
</div>
<div class="input-group">
<label>Series y Repeticiones:</label>
<input type="text" id="manual-series" value="3 series x 10-12 reps" placeholder="Ej: 4 series x 12 reps">
</div>
<button onclick="guardarEjercicioManual()">+ Guardar y Agregar al Día</button>
</div>

<button class="btn-secondary" onclick="cerrarModalBanco()">Cerrar</button>
</div>
</div>

<div class="container">
<nav class="nav-tabs">
<button class="tab-btn active" onclick="cambiarDia('dia1', this)">DÍA 1</button>
<button class="tab-btn" onclick="cambiarDia('dia2', this)">DÍA 2</button>
<button class="tab-btn" onclick="cambiarDia('dia3', this)">DÍA 3</button>
</nav>

<section id="dia1" class="tab-content active">
<div class="day-header">
<h2>Rutina del Día 1</h2>
</div>
<div id="lista-dia1"></div>
<button class="btn-add-open" onclick="abrirModalBanco('dia1')">+ AGREGAR EJERCICIO AL DÍA 1</button>
<div class="finish-wrapper">
<button class="btn-complete" onclick="registrarEntrenamiento('Día 1', 'status-dia1')">
✓ COMPLETAR DÍA 1 (REGISTRAR)
</button>
<div id="status-dia1" class="status-log"></div>
</div>
</section>

<section id="dia2" class="tab-content">
<div class="day-header">
<h2>Rutina del Día 2</h2>
</div>
<div id="lista-dia2"></div>
<button class="btn-add-open" onclick="abrirModalBanco('dia2')">+ AGREGAR EJERCICIO AL DÍA 2</button>
<div class="finish-wrapper">
<button class="btn-complete" onclick="registrarEntrenamiento('Día 2', 'status-dia2')">
✓ COMPLETAR DÍA 2 (REGISTRAR)
</button>
<div id="status-dia2" class="status-log"></div>
</div>
</section>

<section id="dia3" class="tab-content">
<div class="day-header">
<h2>Rutina del Día 3</h2>
</div>
<div id="lista-dia3"></div>
<button class="btn-add-open" onclick="abrirModalBanco('dia3')">+ AGREGAR EJERCICIO AL DÍA 3</button>
<div class="finish-wrapper">
<button class="btn-complete" onclick="registrarEntrenamiento('Día 3', 'status-dia3')">
✓ COMPLETAR DÍA 3 (REGISTRAR)
</button>
<div id="status-dia3" class="status-log"></div>
</div>
</section>
</div>

{ id: "adutora", musculo: "Aductores", nombre: "Cadeira Adutora", series: "3 series x 15 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=maquina+aductora" },
{ id: "abdutora", musculo: "Abductores", nombre: "Cadeira Abdutora", series: "3 series x 15 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=maquina+abductora" },
{ id: "pelvica", musculo: "Glúteo", nombre: "Elevação Pélvica", series: "3 series x 15 reps", img: "https://images.unsplash.com/photo-1566241142559-40e1dab266c6?w=200", video: "https://www.youtube.com/results?search_query=puente+de+gluteo+suelo" },
{ id: "panto_prensa", musculo: "Gemelos", nombre: "Pantorrilla en Prensa", series: "3-4 series x 15 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=pantorrilla+en+prensa" },
{ id: "abd_reto", musculo: "Abdomen", nombre: "Abdominal Reto", series: "4 series x 15 reps", img: "https://images.unsplash.com/photo-1566241142559-40e1dab266c6?w=200", video: "https://www.youtube.com/results?search_query=crunch+abdominal+suelo" }
],
dia3: [
{ id: "puxada", musculo: "Espalda", nombre: "Puxada Anatômica", series: "3-4 series x 10-12 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=jalon+al+pecho+polea+tecnica" },
{ id: "serrote", musculo: "Espalda", nombre: "Serrote Mancuerna", series: "3 series x 10-12 reps", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=200", video: "https://www.youtube.com/results?search_query=remo+con+mancuerna+serrote" },
{ id: "remo_sentado", musculo: "Espalda", nombre: "Remo Barra Anatómica", series: "3 series x 10-12 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=remo+sentado+en+polea+baja" },
{ id: "pullover_polea", musculo: "Espalda", nombre: "Pullover Polea Alta", series: "3 series x 12-15 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=pullover+en+polea+alta+dorsal" },
{ id: "crucifijo_inv", musculo: "Deltoides Post", nombre: "Crucifijo Inverso", series: "3 series x 15 reps", img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=200", video: "https://www.youtube.com/results?search_query=pajaros+con+mancuernas+deltoides+posterior" },
{ id: "triceps_corda", musculo: "Tríceps", nombre: "Tríceps Corda Polea", series: "3-4 series x 12-15 reps", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200", video: "https://www.youtube.com/results?search_query=extension+triceps+cuerda+polea" },
{ id: "triceps_frances", musculo: "Tríceps", nombre: "Tríceps Francés", series: "3 series x 10-12 reps", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=200", video: "https://www.youtube.com/results?search_query=press+frances+triceps+mancuerna" }
]
};

const BANCO_EJERCICIOS = [
...RUTINA_POR_DEFECTO.dia1,
...RUTINA_POR_DEFECTO.dia2,
...RUTINA_POR_DEFECTO.dia3,
{ id: "cruce_poleas", musculo: "Pecho", nombre: "Cruce de Poleas", series: "3 series x 12-15 reps" },
{ id: "fondos_paralelas", musculo: "Pecho", nombre: "Fondos en Paralelas", series: "3 series x 10-12 reps" },
{ id: "sentadilla_libre", musculo: "Pierna", nombre: "Sentadilla Libre / Smith", series: "4 series x 8-10 reps" },
{ id: "peso_muerto_rum", musculo: "Isquios", nombre: "Peso Muerto Rumano", series: "3-4 series x 10-12 reps" },
{ id: "zancadas", musculo: "Pierna", nombre: "Zancadas / Estocadas", series: "3 series x 12 reps" },
{ id: "hip_thrust", musculo: "Glúteo", nombre: "Hip Thrust con Barra", series: "4 series x 10-12 reps" },
{ id: "dominadas", musculo: "Espalda", nombre: "Dominadas / Gravitón", series: "3-4 series x 8-10 reps" },
{ id: "remo_barra", musculo: "Espalda", nombre: "Remo con Barra", series: "3-4 series x 10 reps" },
{ id: "face_pull", musculo: "Deltoides Post", nombre: "Face Pull en Polea", series: "3 series x 15 reps" },
{ id: "biceps_scott", musculo: "Bíceps", nombre: "Curl en Banco Scott", series: "3 series x 10-12 reps" },
{ id: "biceps_inclinado", musculo: "Bíceps", nombre: "Curl Mancuernas Inclinado", series: "3 series x 12 reps" },
{ id: "triceps_barra", musculo: "Tríceps", nombre: "Tríceps en Polea con Barra", series: "3 series x 12-15 reps" },
{ id: "press_cerrado", musculo: "Tríceps", nombre: "Press Francés Barra W", series: "3 series x 10-12 reps" }
];

let usuarioActual = localStorage.getItem("gym_usuario") || "";
let rutinaData = cargarRutinaLocal();
let diaActivoParaAgregar = "dia1";

function cargarRutinaLocal() {
if (usuarioActual) {
const guardada = localStorage.getItem(`rutina_${usuarioActual}`);
if (guardada) {
try { return JSON.parse(guardada); } catch (e) {}
}
}
return JSON.parse(JSON.stringify(RUTINA_POR_DEFECTO));
}

function guardarRutinaActual() {
if (!usuarioActual) return;
localStorage.setItem(`rutina_${usuarioActual}`, JSON.stringify(rutinaData));

if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("PEGA_AQUI")) {
fetch(GOOGLE_SCRIPT_URL, {
method: "POST",
mode: "no-cors",
headers: { "Content-Type": "text/plain;charset=utf-8" },
body: JSON.stringify({
tipo: "guardar_rutina",
usuario: usuarioActual,
rutina: rutinaData
})
});
}
}

function inicializarApp() {
const modal = document.getElementById("modal-usuario");
const display = document.getElementById("nombre-usuario-display");
const btnLogout = document.getElementById("btn-logout");

if (!usuarioActual) {
if (display) display.innerText = "Ingresar";
if (modal) modal.style.display = "flex";
if (btnLogout) btnLogout.style.display = "none";
} else {
if (display) display.innerText = usuarioActual;
if (btnLogout) btnLogout.style.display = "inline-block";
}

rutinaData = cargarRutinaLocal();
renderizarTarjetas();

if (usuarioActual) {
sincronizarDatosNube();
}
}

function renderizarTarjetas() {
for (const dia of ["dia1", "dia2", "dia3"]) {
const contenedor = document.getElementById("lista-" + dia);
if (!contenedor) continue;
contenedor.innerHTML = "";

const listaEjercicios = rutinaData[dia] || [];
if (listaEjercicios.length === 0) {
contenedor.innerHTML = `<div class="empty-day-msg">No hay ejercicios en este día. Toca el botón de abajo para agregar del banco o crear uno.</div>`;
continue;
}

listaEjercicios.forEach((ex, index) => {
const claveLocal = `peso_${usuarioActual}_${ex.id}`;
const pesoLocal = usuarioActual ? (localStorage.getItem(claveLocal) || "") : "";
const tagClass = "tag-" + ex.musculo.toLowerCase().replace(/[\s/]/g, "-");
const imgUrl = ex.img || IMAGENES_MUSCULO[ex.musculo] || "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200";
const videoUrl = ex.video || `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.nombre + " tecnica")}`;

const card = document.createElement("div");
card.className = "exercise-card";
card.innerHTML = `
<button class="btn-remove-ex" title="Quitar de mi día" onclick="quitarEjercicio('${dia}', ${index})">✕</button>
<div class="card-top">
<img class="thumb" src="${imgUrl}" alt="${ex.nombre}" loading="lazy">
<div class="info">
<span class="tag ${tagClass}">${ex.musculo}</span>
<h3>${ex.nombre}</h3>
<div class="scheme">${ex.series}</div>
</div>
</div>
<div class="card-bottom">
<div class="weight-control">
<label for="input-${dia}-${index}">Peso:</label>
<input id="input-${dia}-${index}" data-exid="${ex.id}" class="weight-input" type="text" inputmode="decimal" value="${pesoLocal}" placeholder="0 kg" onchange="guardarPeso('${ex.id}', this.value)">
</div>
<a href="${videoUrl}" target="_blank" rel="noopener noreferrer" class="video-btn">
▶ Ver video
</a>
</div>
`;
contenedor.appendChild(card);
});
}
}

function quitarEjercicio(dia, index) {
if (!usuarioActual) {
abrirModalSiNoHayUsuario();
return;
}
const ex = rutinaData[dia][index];
if (confirm(`¿Quitar "${ex.nombre}" de este día?`)) {
rutinaData[dia].splice(index, 1);
guardarRutinaActual();
renderizarTarjetas();
}
}

function abrirModalBanco(dia) {
if (!usuarioActual) {
abrirModalSiNoHayUsuario();
return;
}
diaActivoParaAgregar = dia;
const numeroDia = dia.replace("dia", "");
document.getElementById("titulo-modal-banco").innerText = `Agregar Ejercicio al Día ${numeroDia}`;
document.getElementById("buscar-ex").value = "";
document.getElementById("filtro-musculo").value = "";
cambiarModoBanco("catalogo");
filtrarBanco();
document.getElementById("modal-banco").style.display = "flex";
}

function cerrarModalBanco() {
document.getElementById("modal-banco").style.display = "none";
}

function cambiarModoBanco(modo) {
const vistaCat = document.getElementById("vista-catalogo");
const vistaMan = document.getElementById("vista-manual");
const tabCat = document.getElementById("tab-catalogo");
const tabMan = document.getElementById("tab-manual");

if (modo === "catalogo") {
vistaCat.style.display = "block";
vistaMan.style.display = "none";
tabCat.classList.add("active");
tabMan.classList.remove("active");
} else {
vistaCat.style.display = "none";
vistaMan.style.display = "block";
tabCat.classList.remove("active");
tabMan.classList.add("active");
}
}

function filtrarBanco() {
const texto = document.getElementById("buscar-ex").value.toLowerCase().trim();
const musculoFiltro = document.getElementById("filtro-musculo").value;
const contenedor = document.getElementById("lista-banco");
contenedor.innerHTML = "";

const filtrados = BANCO_EJERCICIOS.filter(ex => {
const coincideTexto = ex.nombre.toLowerCase().includes(texto) || ex.musculo.toLowerCase().includes(texto);
let coincideMusculo = true;
if (musculoFiltro) {
if (musculoFiltro === "Pierna") {
coincideMusculo = ["Pierna", "Cuádriceps", "Isquios", "Aductores", "Abductores"].includes(ex.musculo);
} else if (musculoFiltro === "Abdomen") {
coincideMusculo = ["Abdomen", "Core"].includes(ex.musculo);
} else {
coincideMusculo = ex.musculo === musculoFiltro;
}
}
return coincideTexto && coincideMusculo;
});

if (filtrados.length === 0) {
contenedor.innerHTML = `<div style="text-align:center; padding:14px; color:#94a3b8; font-size:0.84rem;">No se encontró ese ejercicio. ¡Usa la pestaña "Crear Manual" arriba para agregarlo!</div>`;
return;
}

filtrados.forEach(ex => {
const tagClass = "tag-" + ex.musculo.toLowerCase().replace(/[\s/]/g, "-");
const item = document.createElement("div");
item.className = "banco-item";
item.innerHTML = `
<div class="banco-item-info">
<span class="tag ${tagClass}">${ex.musculo}</span>
<h4>${ex.nombre}</h4>
</div>
<button class="btn-pick" onclick="seleccionarDelBanco('${ex.id}')">+ Agregar</button>
`;
contenedor.appendChild(item);
});
}

function seleccionarDelBanco(idEjercicio) {
const base = BANCO_EJERCICIOS.find(e => e.id === idEjercicio);
if (!base) return;

const seriesElegidas = document.getElementById("series-catalogo").value.trim() || base.series || "3 series x 10-12 reps";
const nuevoEx = {
id: base.id,
musculo: base.musculo,
nombre: base.nombre,
series: seriesElegidas,
img: base.img || IMAGENES_MUSCULO[base.musculo] || "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200",
video: base.video || `https://www.youtube.com/results?search_query=${encodeURIComponent(base.nombre + " tecnica")}`
};

rutinaData[diaActivoParaAgregar].push(nuevoEx);
guardarRutinaActual();
renderizarTarjetas();
cerrarModalBanco();
}

function guardarEjercicioManual() {
const nombre = document.getElementById("manual-nombre").value.trim();
const musculo = document.getElementById("manual-musculo").value;
const series = document.getElementById("manual-series").value.trim() || "3 series x 10-12 reps";

if (!nombre) {
alert("Por favor escribe el nombre del ejercicio.");
return;
}

const idLimpio = "custom_" + nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "_");
const nuevoEx = {
id: idLimpio,
musculo: musculo,
nombre: nombre,
series: series,
img: IMAGENES_MUSCULO[musculo] || "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=200",
video: `https://www.youtube.com/results?search_query=${encodeURIComponent(nombre + " ejercicio tecnica")}`
};

if (!BANCO_EJERCICIOS.some(e => e.id === idLimpio)) {
BANCO_EJERCICIOS.push(nuevoEx);
}

rutinaData[diaActivoParaAgregar].push(nuevoEx);
guardarRutinaActual();
renderizarTarjetas();
document.getElementById("manual-nombre").value = "";
cerrarModalBanco();
}

function estadoBotonesAuth(deshabilitar) {
document.getElementById("btn-login").disabled = deshabilitar;
document.getElementById("btn-reg").disabled = deshabilitar;
}

function procesarAcceso(accion) {
const user = document.getElementById("input-user").value.toLowerCase().trim();
const pass = document.getElementById("input-pass").value.trim();
const statusEl = document.getElementById("login-status");

if (!user || !pass) {
statusEl.style.color = "#fbbf24";
statusEl.innerText = "Ingresa usuario y contraseña.";
return;
}

estadoBotonesAuth(true);
statusEl.style.color = "#38bdf8";
statusEl.innerText = accion === 'registro' ? "Registrando en Google Sheets..." : "Verificando usuario y clave...";

fetch(`${GOOGLE_SCRIPT_URL}?accion=${accion}&usuario=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`)
.then(response => response.json())
.then(res => {
estadoBotonesAuth(false);
if (!res || res.status !== "success") {
statusEl.style.color = "#ef4444";
statusEl.innerText = res ? res.mensaje : "Error de respuesta del servidor.";
return;
}

usuarioActual = res.usuario;
localStorage.setItem("gym_usuario", usuarioActual);

document.getElementById("nombre-usuario-display").innerText = usuarioActual;
document.getElementById("btn-logout").style.display = "inline-block";
document.getElementById("modal-usuario").style.display = "none";
statusEl.innerText = "";

if (res.pesos) {
for (const id in res.pesos) {
localStorage.setItem(`peso_${usuarioActual}_${id}`, res.pesos[id]);
}
}

if (res.rutina) {
try {
rutinaData = JSON.parse(res.rutina);
localStorage.setItem(`rutina_${usuarioActual}`, res.rutina);
} catch (e) {
rutinaData = cargarRutinaLocal();
}
} else {
rutinaData = cargarRutinaLocal();
}

renderizarTarjetas();
})
.catch(err => {
estadoBotonesAuth(false);
statusEl.style.color = "#ef4444";
statusEl.innerText = "Error de red al conectar con Google Sheets.";
});
}

function abrirModalSiNoHayUsuario() {
if (!usuarioActual) {
document.getElementById("modal-usuario").style.display = "flex";
}
}

function cerrarSesion() {
localStorage.removeItem("gym_usuario");
usuarioActual = "";
rutinaData = JSON.parse(JSON.stringify(RUTINA_POR_DEFECTO));
document.getElementById("nombre-usuario-display").innerText = "Ingresar";
document.getElementById("input-user").value = "";
document.getElementById("input-pass").value = "";
document.getElementById("login-status").innerText = "";
document.getElementById("btn-logout").style.display = "none";
renderizarTarjetas();
document.getElementById("modal-usuario").style.display = "flex";
}

function sincronizarDatosNube() {
if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PEGA_AQUI") || !usuarioActual) return;

fetch(`${GOOGLE_SCRIPT_URL}?usuario=${encodeURIComponent(usuarioActual)}`)
.then(response => response.json())
.then(datosRemotos => {
if (!datosRemotos) return;
const pesosRemotos = datosRemotos.pesos || datosRemotos;
for (const id in pesosRemotos) {
if (id === "pesos" || id === "rutina") continue;
const peso = pesosRemotos[id];
localStorage.setItem(`peso_${usuarioActual}_${id}`, peso);
document.querySelectorAll(`input[data-exid="${id}"]`).forEach(inp => inp.value = peso);
}

if (datosRemotos.rutina) {
try {
rutinaData = JSON.parse(datosRemotos.rutina);
localStorage.setItem(`rutina_${usuarioActual}`, datosRemotos.rutina);
renderizarTarjetas();
} catch (e) {}
}
})
.catch(err => {});
}

function guardarPeso(id, valor) {
usuarioActual = localStorage.getItem("gym_usuario") || usuarioActual;
if (!usuarioActual) {
cerrarSesion();
return;
}

const limpio = valor.trim();
localStorage.setItem(`peso_${usuarioActual}_${id}`, limpio);
document.querySelectorAll(`input[data-exid="${id}"]`).forEach(inp => inp.value = limpio);

if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("PEGA_AQUI")) {
fetch(GOOGLE_SCRIPT_URL, {
method: "POST",
mode: "no-cors",
headers: { "Content-Type": "text/plain;charset=utf-8" },
body: JSON.stringify({
tipo: "guardar_peso",
usuario: usuarioActual,
id: id,
peso: limpio
})
});
}
}

function cambiarDia(diaId, btnEl) {
document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
document.getElementById(diaId).classList.add("active");
if (btnEl) btnEl.classList.add("active");
window.scrollTo({ top: 0, behavior: "smooth" });
}

function registrarEntrenamiento(nombreRutina, statusId) {
usuarioActual = localStorage.getItem("gym_usuario") || usuarioActual;

if (!usuarioActual) {
cerrarSesion();
return;
}

const statusEl = document.getElementById(statusId);
statusEl.style.color = "#38bdf8";
statusEl.innerText = "Registrando en Google Drive...";

const ahora = new Date();
const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const diaSemana = diasSemana[ahora.getDay()];
const fecha = ahora.toISOString().split("T")[0];

fetch(GOOGLE_SCRIPT_URL, {
method: "POST",
mode: "no-cors",
headers: { "Content-Type": "text/plain;charset=utf-8" },
body: JSON.stringify({
tipo: "completar_sesion",
usuario: usuarioActual,
fecha: fecha,
diaSemana: diaSemana,
rutina: nombreRutina,
notas: "Completado (" + usuarioActual + ")"
})
}).then(() => {
statusEl.style.color = "#10b981";
statusEl.innerText = `✓ ¡Excelente ${usuarioActual}! Guardado en Drive (${diaSemana} ${fecha}).`;
}).catch(() => {
statusEl.style.color = "#ef4444";
statusEl.innerText = "Error al conectar con Drive.";
});
}

document.addEventListener("DOMContentLoaded", inicializarApp);
</script>
