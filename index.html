<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Rutina</title>
<style>
:root {
  --bg-main: #0b1120;
  --bg-card: #151e32;
  --bg-card-hover: #1b2640;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --success: #10b981;
  --danger: #ef4444;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border: #24324f;
  --badge-pecho: #2563eb;
  --badge-hombro: #8b5cf6;
  --badge-biceps: #059669;
  --badge-pierna: #ea580c;
  --badge-espalda: #0284c7;
  --badge-triceps: #d97706;
  --badge-core: #64748b;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  background-color: var(--bg-main);
  color: var(--text-main);
  padding-bottom: 70px;
}
header {
  background: rgba(11, 17, 32, 0.95);
  backdrop-filter: blur(10px);
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-content {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 {
  font-size: 1.2rem;
  letter-spacing: 0.5px;
  font-weight: 700;
}
.user-info-container {
  display: flex;
  align-items: center;
  gap: 8px;
}
.user-badge {
  background: #1e293b;
  color: #38bdf8;
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 700;
}
.btn-logout {
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
  border: 1px solid rgba(239, 68, 68, 0.3);
  padding: 6px 10px;
  border-radius: 12px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
}
.btn-logout:hover {
  background: rgba(239, 68, 68, 0.3);
}
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 16px;
}
.nav-tabs {
  display: flex;
  gap: 8px;
  margin: 16px 0 20px;
  background: #11192d;
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.tab-btn {
  flex: 1;
  padding: 12px 6px;
  font-size: 0.9rem;
  font-weight: 700;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tab-btn.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}
.day-header {
  margin-bottom: 16px;
}
.day-header h2 {
  font-size: 1.1rem;
  color: #38bdf8;
  font-weight: 600;
}
.exercise-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card-top {
  display: flex;
  gap: 14px;
  align-items: center;
}
.thumb {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  object-fit: cover;
  background: #0b1120;
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.info {
  flex: 1;
  min-width: 0;
}
.tag {
  display: inline-block;
  font-size: 0.68rem;
  text-transform: uppercase;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 5px;
  margin-bottom: 5px;
  color: #ffffff;
}
.tag-pecho { background: var(--badge-pecho); }
.tag-hombro { background: var(--badge-hombro); }
.tag-bíceps, .tag-biceps { background: var(--badge-biceps); }
.tag-pierna, .tag-cuádriceps, .tag-isquios, .tag-aductores, .tag-abductores, .tag-glúteo, .tag-gemelos { background: var(--badge-pierna); }
.tag-espalda, .tag-deltoides-post { background: var(--badge-espalda); }
.tag-tríceps { background: var(--badge-triceps); }
.tag-core, .tag-trapecio, .tag-abdomen { background: var(--badge-core); }
.info h3 {
  font-size: 0.98rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.scheme {
  font-size: 0.82rem;
  color: var(--text-muted);
}
.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.weight-control {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: #cbd5e1;
}
.weight-input {
  width: 70px;
  padding: 6px 10px;
  background: #090e1a;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #34d399;
  font-size: 0.95rem;
  font-weight: 700;
  text-align: center;
  outline: none;
}
.weight-input:focus {
  border-color: #10b981;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
}
.video-btn {
  font-size: 0.82rem;
  font-weight: 600;
  color: #38bdf8;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(56, 189, 248, 0.08);
}
.finish-wrapper {
  margin-top: 24px;
  text-align: center;
}
.btn-complete {
  width: 100%;
  padding: 16px;
  background: var(--success);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
}
.btn-complete:active {
  transform: scale(0.98);
}
.status-log {
  margin-top: 10px;
  font-size: 0.85rem;
  font-weight: 500;
  min-height: 20px;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
}
.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  max-width: 360px;
  width: 100%;
  text-align: center;
}
.modal-box h2 {
  margin-bottom: 6px;
  color: #fff;
}
.modal-box p {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.input-group {
  text-align: left;
  margin-bottom: 12px;
}
.input-group label {
  display: block;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-weight: 600;
}
.modal-box input {
  width: 100%;
  padding: 11px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #090e1a;
  color: #fff;
  font-size: 1rem;
  outline: none;
}
.modal-box input:focus {
  border-color: var(--primary);
}
.modal-box button {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
}
.btn-secondary {
  background: transparent !important;
  color: var(--text-muted) !important;
  border: 1px solid var(--border) !important;
  margin-top: 8px !important;
}
.login-msg {
  margin-top: 10px;
  font-size: 0.82rem;
  min-height: 18px;
}
</style>
</head>
<body>

<div class="container">

</div>

let usuarioActual = localStorage.getItem("gym_usuario") || "";

function inicializarApp() {
  const modal = document.getElementById("modal-usuario");
  const display = document.getElementById("nombre-usuario-display");
  const btnLogout = document.getElementById("btn-logout");

  if (!usuarioActual) {
    if (modal) modal.style.display = "flex";
    if (btnLogout) btnLogout.style.display = "none";
  } else {
    if (display) display.innerText = usuarioActual;
    if (btnLogout) btnLogout.style.display = "inline-block";
  }

  renderizarTarjetas();

  if (usuarioActual) {
    sincronizarPesosNube();
  }
}

function renderizarTarjetas() {
  for (const dia in rutinaData) {
    const contenedor = document.getElementById("lista-" + dia);
    if (!contenedor) continue;
    contenedor.innerHTML = "";

    rutinaData[dia].forEach(ex => {
      const claveLocal = `peso_${usuarioActual}_${ex.id}`;
      const pesoLocal = usuarioActual ? (localStorage.getItem(claveLocal) || "") : "";
      const tagClass = "tag-" + ex.musculo.toLowerCase().replace(/[\s/]/g, "-");

      const card = document.createElement("div");
      card.className = "exercise-card";
      card.innerHTML = `
        <div class="card-top">
          <img class="thumb" src="${ex.img}" alt="${ex.nombre}" loading="lazy">
          <div class="info">
            <span class="tag ${tagClass}">${ex.musculo}</span>
            <h3>${ex.nombre}</h3>
            <div class="scheme">${ex.series}</div>
          </div>
        </div>
        <div class="card-bottom">
          <div class="weight-control">
            <label for="input-${ex.id}">Peso:</label>
            <input id="input-${ex.id}" class="weight-input" type="text" inputmode="decimal" value="${pesoLocal}" placeholder="0 kg" onchange="guardarPeso('${ex.id}', this.value)">
          </div>
          <a href="${ex.video}" target="_blank" rel="noopener noreferrer" class="video-btn">
            ▶ Ver video
          </a>
        </div>
      `;
      contenedor.appendChild(card);
    });
  }
}

window.respuestaAuth = function(res) {
  const statusEl = document.getElementById("login-status");
  if (!res || res.status === "error") {
    if (statusEl) {
      statusEl.style.color = "#ef4444";
      statusEl.innerText = res ? res.mensaje : "Error de conexión.";
    }
    return;
  }

  usuarioActual = res.usuario || document.getElementById("input-user").value.toLowerCase().trim();
  localStorage.setItem("gym_usuario", usuarioActual);

  document.getElementById("nombre-usuario-display").innerText = usuarioActual;
  document.getElementById("btn-logout").style.display = "inline-block";
  document.getElementById("modal-usuario").style.display = "none";
  if (statusEl) statusEl.innerText = "";

  if (res.pesos) {
    for (const id in res.pesos) {
      localStorage.setItem(`peso_${usuarioActual}_${id}`, res.pesos[id]);
    }
  }
  renderizarTarjetas();
  sincronizarPesosNube();
};

function procesarAcceso(accion) {
  const user = document.getElementById("input-user").value.toLowerCase().trim();
  const pass = document.getElementById("input-pass").value.trim();
  const statusEl = document.getElementById("login-status");

  if (!user || !pass) {
    statusEl.style.color = "#fbbf24";
    statusEl.innerText = "Ingresa usuario y contraseña.";
    return;
  }

  statusEl.style.color = "#38bdf8";
  statusEl.innerText = accion === 'registro' ? "Registrando usuario..." : "Verificando acceso...";

  const script = document.createElement("script");
  script.src = `${GOOGLE_SCRIPT_URL}?accion=${accion}&usuario=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}&callback=respuestaAuth&t=${new Date().getTime()}`;
  document.body.appendChild(script);
}

function cerrarSesion() {
  localStorage.removeItem("gym_usuario");
  usuarioActual = "";
  document.getElementById("input-user").value = "";
  document.getElementById("input-pass").value = "";
  document.getElementById("login-status").innerText = "";
  document.getElementById("btn-logout").style.display = "none";
  document.getElementById("modal-usuario").style.display = "flex";
}

window.recibirPesosDesdeNube = function(pesosRemotos) {
  if (!usuarioActual || !pesosRemotos) return;

  for (const id in pesosRemotos) {
    const peso = pesosRemotos[id];
    localStorage.setItem(`peso_${usuarioActual}_${id}`, peso);
    const input = document.getElementById("input-" + id);
    if (input) input.value = peso;
  }
};

function sincronizarPesosNube() {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PEGA_AQUI") || !usuarioActual) return;

  const script = document.createElement("script");
  script.src = `${GOOGLE_SCRIPT_URL}?usuario=${encodeURIComponent(usuarioActual)}&callback=recibirPesosDesdeNube&t=${new Date().getTime()}`;
  document.body.appendChild(script);
}

function guardarPeso(id, valor) {
  usuarioActual = localStorage.getItem("gym_usuario") || usuarioActual;
  if (!usuarioActual) {
    cerrarSesion();
    return;
  }

  const limpio = valor.trim();
  localStorage.setItem(`peso_${usuarioActual}_${id}`, limpio);

  if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("PEGA_AQUI")) {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        tipo: "guardar_peso",
        usuario: usuarioActual,
        id: id,
        peso: limpio
      })
    });
  }
}

function cambiarDia(diaId, btnEl) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(diaId).classList.add("active");
  if (btnEl) btnEl.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function registrarEntrenamiento(nombreRutina, statusId) {
  usuarioActual = localStorage.getItem("gym_usuario") || usuarioActual;

  if (!usuarioActual) {
    cerrarSesion();
    return;
  }

  const statusEl = document.getElementById(statusId);
  statusEl.style.color = "#38bdf8";
  statusEl.innerText = "Registrando en Google Drive...";

  const ahora = new Date();
  const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const diaSemana = diasSemana[ahora.getDay()];
  const fecha = ahora.toISOString().split("T")[0];

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      tipo: "completar_sesion",
      usuario: usuarioActual,
      fecha: fecha,
      diaSemana: diaSemana,
      rutina: nombreRutina,
      notas: "Completado (" + usuarioActual + ")"
    })
  }).then(() => {
    statusEl.style.color = "#10b981";
    statusEl.innerText = `✓ ¡Excelente ${usuarioActual}! Guardado en Drive (${diaSemana} ${fecha}).`;
  }).catch(() => {
    statusEl.style.color = "#ef4444";
    statusEl.innerText = "Error al conectar con Drive.";
  });
}

document.addEventListener("DOMContentLoaded", inicializarApp);
</script>
